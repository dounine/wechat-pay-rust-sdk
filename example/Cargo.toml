[package]
name = "example"
version = "0.1.0"
edition = "2024"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "4"
dotenvy = "0.15"
# 刻意**不**开 debug-print：它会打印 Authorization 头与请求体（含 openid、金额）。
# 示例会被当成生产范本抄走，默认必须是安全的那一档。
wechat-pay-rust-sdk = { path = "..", features = ["async"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
